<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">foma-skills</title>
  <desc id="d">Lightweight skills for Claude Code: shape an idea, plan, build, test, review, commit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15141c"/>
      <stop offset="0.55" stop-color="#1c1a2b"/>
      <stop offset="1" stop-color="#14212b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b95a"/>
      <stop offset="0.5" stop-color="#8fb8e6"/>
      <stop offset="1" stop-color="#6fd0b9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#7fa9d6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7fa9d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1280" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="22" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="338" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="128" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-1.5">foma-skills</text>
    <text x="66" y="176" font-size="27" fill="#ece8e1">Lightweight skills for Claude Code</text>
    <text x="66" y="210" font-size="18" fill="#a29c92">From the first question to a merged commit, with almost no always-on cost.</text>

    <g font-size="17" font-weight="600">
      <rect x="64" y="246" width="128" height="40" rx="20" fill="#e0a54a" fill-opacity="0.16" stroke="#e0a54a" stroke-opacity="0.7"/>
      <text x="128" y="272" text-anchor="middle" fill="#f0c274">17 skills</text>
      <rect x="204" y="246" width="250" height="40" rx="20" fill="#7fa9d6" fill-opacity="0.16" stroke="#7fa9d6" stroke-opacity="0.7"/>
      <text x="329" y="272" text-anchor="middle" fill="#a9c8ea">≈1.4k tokens always on</text>
      <rect x="466" y="246" width="262" height="40" rx="20" fill="#6cc0ad" fill-opacity="0.16" stroke="#6cc0ad" stroke-opacity="0.7"/>
      <text x="597" y="272" text-anchor="middle" fill="#8fd9c7">propose first, write after ok</text>
    </g>

    <!-- flow of a task: 1-2-3 to the right, then 4-5-6 back to the left -->
    <g text-anchor="middle" font-size="15" font-weight="600">
      <g stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M866 118 L946 118" stroke="#e0a54a"/>
        <path d="M998 118 L1084 118" stroke="#7fa9d6"/>
        <path d="M1110 146 L1110 204" stroke="#6cc0ad" stroke-dasharray="2 7"/>
        <path d="M1084 232 L998 232" stroke="#a3adba"/>
        <path d="M946 232 L866 232" stroke="#d98a9c"/>
      </g>
      <circle cx="840" cy="118" r="31" fill="#e0a54a" filter="url(#soft)" opacity="0.35"/>
      <circle cx="840" cy="118" r="26" fill="#e0a54a"/>
      <circle cx="972" cy="118" r="26" fill="#7fa9d6"/>
      <circle cx="1110" cy="118" r="26" fill="#6cc0ad"/>
      <circle cx="1110" cy="232" r="26" fill="#a3adba"/>
      <circle cx="972" cy="232" r="26" fill="#d98a9c"/>
      <circle cx="840" cy="232" r="26" fill="#f0c274"/>
      <g fill="#15141c" font-size="22">
        <text x="840" y="126">1</text><text x="972" y="126">2</text><text x="1110" y="126">3</text>
        <text x="1110" y="240">4</text><text x="972" y="240">5</text><text x="840" y="240">6</text>
      </g>
      <g fill="#cfcac2" font-size="14" font-weight="500">
        <text x="840" y="76">shape</text><text x="972" y="76">plan</text><text x="1110" y="76">build</text>
        <text x="1110" y="284">test</text><text x="972" y="284">review</text><text x="840" y="284">commit</text>
      </g>
    </g>
  </g>
</svg>
