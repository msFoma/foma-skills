<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="Propose first, write after your ok">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15141c"/><stop offset="0.6" stop-color="#1b1a28"/><stop offset="1" stop-color="#14202a"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8579"/></marker></defs>
<rect width="1280" height="430" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="428" rx="19" fill="none" stroke="#fff" stroke-opacity="0.08"/>
<g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="48" y="58" font-size="30" font-weight="800" fill="#ece8e1">Propose first, write after your ok</text><text x="48" y="88" font-size="16" fill="#a29c92">The rule every skill that changes files follows.</text><rect x="48" y="104" width="64" height="4" rx="2" fill="#e8714a"/>
<path d="M192.66666666666669,215 L298.0,215" stroke="#8a8579" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M390.0,215 L495.33333333333337,215" stroke="#8a8579" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M587.3333333333334,215 L692.6666666666667,215" stroke="#8a8579" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M784.6666666666667,215 L890.0,215" stroke="#8a8579" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><path d="M982.0,215 L1087.3333333333335,215" stroke="#8a8579" stroke-width="2.5" fill="none" marker-end="url(#ar)"/><circle cx="146.66666666666669" cy="215" r="38" fill="#a3adba"/><text x="146.66666666666669" y="224" text-anchor="middle" font-size="26" font-weight="800" fill="#15141c">1</text><text x="146.66666666666669" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#ece8e1">You ask</text><text x="146.66666666666669" y="323" text-anchor="middle" font-size="14" fill="#a29c92">“Clean up the repo”</text><circle cx="344.0" cy="215" r="38" fill="#7fa9d6"/><text x="344.0" y="224" text-anchor="middle" font-size="26" font-weight="800" fill="#15141c">2</text><text x="344.0" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#ece8e1">Skill reads</text><text x="344.0" y="323" text-anchor="middle" font-size="14" fill="#a29c92">only what it needs</text><circle cx="541.3333333333334" cy="215" r="38" fill="#e0a54a"/><text x="541.3333333333334" y="224" text-anchor="middle" font-size="26" font-weight="800" fill="#15141c">3</text><text x="541.3333333333334" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#ece8e1">Shows the change</text><text x="541.3333333333334" y="323" text-anchor="middle" font-size="14" fill="#a29c92">file, diff, what goes</text><circle cx="738.6666666666667" cy="215" r="58" fill="#e8714a" fill-opacity="0.16"/><circle cx="738.6666666666667" cy="215" r="44" fill="#e8714a"/><text x="738.6666666666667" y="224" text-anchor="middle" font-size="30" font-weight="800" fill="#15141c">4</text><text x="738.6666666666667" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#ece8e1">You say “ok”</text><text x="738.6666666666667" y="323" text-anchor="middle" font-size="14" fill="#a29c92">per item, nothing before</text><circle cx="936.0" cy="215" r="38" fill="#6cc0ad"/><text x="936.0" y="224" text-anchor="middle" font-size="26" font-weight="800" fill="#15141c">5</text><text x="936.0" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#ece8e1">Then it writes</text><text x="936.0" y="323" text-anchor="middle" font-size="14" fill="#a29c92">reversible: .trash/, git rm</text><circle cx="1133.3333333333335" cy="215" r="38" fill="#d98a9c"/><text x="1133.3333333333335" y="224" text-anchor="middle" font-size="26" font-weight="800" fill="#15141c">6</text><text x="1133.3333333333335" y="299" text-anchor="middle" font-size="18" font-weight="700" fill="#ece8e1">Report</text><text x="1133.3333333333335" y="323" text-anchor="middle" font-size="14" fill="#a29c92">ends with “Not checked: …”</text><path d="M738.6666666666667,155 C738.6666666666667,95 344.0,95 344.0,171" fill="none" stroke="#e8714a" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="541" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#e8714a">no ok  →  nothing is written</text></g></svg>
