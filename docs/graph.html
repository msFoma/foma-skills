<head>

<title>Foma Skills · skill map</title>
<meta name="description" content="Interactive map of Foma Skills: 17 lightweight Claude Code skills, who calls whom, token cost and a typical task path.">
<meta name="theme-color" content="#07060b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23e8714a'/%3E%3C/svg%3E">
<style>
:root{--bg:#07060b;--panel:rgba(13,11,18,.84);--panel2:rgba(20,17,26,.9);--ink:#f4ece6;--muted:#b9afa7;--faint:#958b84;
--brand:#e8714a;--hot:#ff8a4c;--line:rgba(244,236,230,.10);--line2:rgba(244,236,230,.2);color-scheme:dark;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow-x:hidden}
a{color:var(--hot)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:8px;z-index:50;background:var(--brand);color:#140a06;padding:8px 12px;border-radius:8px;font-weight:700}
.skip:focus{left:12px}
.wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:0 24px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px;padding:18px 0 8px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot);font-weight:700}
h1{margin:0;font-size:32px;line-height:1.1;letter-spacing:-.01em;font-weight:800}
h1 b{color:var(--brand)}
.sub{margin:4px 0 0;color:var(--muted);max-width:620px;font-size:14.5px}
.stats{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px}
.stats li{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px;min-width:96px}
.stats b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--ink)}
.stats li.hot b{color:var(--hot);text-shadow:0 0 18px rgba(255,138,76,.45)}
.stats span{font-size:12.5px;color:var(--muted)}
.stats small{display:block;font-size:12px;color:var(--faint)}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:8px 0 8px}
.search{position:relative;flex:1 1 220px;max-width:300px}
.search input{width:100%;height:38px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);padding:0 12px 0 34px;font-size:14.5px}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:11px;top:11px;opacity:.7}
.list{position:absolute;z-index:20;left:0;right:0;top:42px;margin:0;padding:6px;list-style:none;background:#14111b;border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.list li{display:flex;gap:8px;align-items:baseline;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:14px}
.list li[aria-selected=true],.list li:hover{background:rgba(232,113,74,.16)}
.list li i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);transform:translateY(-1px)}
.list li span{font-family:var(--mono);font-weight:600}
.list li em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.list li.none{color:var(--muted);cursor:default}
.group{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.glabel{font-size:12.5px;color:var(--muted);margin-right:2px}
.chip,.seg button,.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;height:32px;padding:0 12px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.chip:hover,.seg button:hover,.btn:hover{border-color:rgba(255,138,76,.55)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--c,#e8714a) 22%,#120f17);border-color:var(--c,#e8714a)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;background:var(--panel2)}
.seg button{border:0;height:28px;background:transparent;padding:0 11px}
.seg button[aria-pressed=true]{background:rgba(232,113,74,.22);color:#fff}
.btn.play{background:linear-gradient(135deg,#ff8a4c,#e8714a 55%,#b84d2c);border:0;color:#170a05;font-weight:700;height:36px;padding:0 16px;box-shadow:0 0 0 1px rgba(255,170,120,.35),0 6px 22px rgba(232,113,74,.35)}
.btn.play:hover{filter:brightness(1.08)}
.btn.play svg{fill:currentColor}
.hint{margin:0 0 10px;color:var(--faint);font-size:12.5px}
.hint .t{display:none}
@media (hover:none){.hint .m{display:none}.hint .t{display:inline}}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.gwrap{position:relative;border:1px solid var(--line);border-radius:22px;background:radial-gradient(70% 50% at 50% 0,rgba(232,113,74,.07),transparent 70%),rgba(9,8,13,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 30px 80px rgba(0,0,0,.35)}
#map{display:block;width:100%;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.band{opacity:.05}
.band-l{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.band-d{font-size:12px;fill:var(--faint)}
.edge{fill:none;stroke-width:1.6;opacity:.42;transition:opacity .3s,stroke-width .3s}
.edge.k-signal{stroke-dasharray:5 6;opacity:.55}
.edge.k-write{stroke-width:2;opacity:.7}
.edge.k-read{stroke-dasharray:2 5;opacity:0}
.edge.lit{opacity:1;stroke-width:2.4}
.edge.k-read.lit{opacity:.6;stroke-width:1.6}
.edge.dim{opacity:.06}
.elabel{font-size:12px;font-weight:600;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#07060b;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
.elabel.lit{opacity:1}
.pt{transition:opacity .35s}
.pt.dim{opacity:.05}
.pt.lit circle{r:4}
.node{cursor:pointer;outline:none;transition:opacity .3s}
.node.dim{opacity:.16}
.node.half{opacity:.55}
.pop{transform-box:fill-box;transform-origin:center}
.halo{opacity:.55;transition:opacity .3s;animation:breathe 5s ease-in-out infinite;animation-delay:var(--b,0s)}
@keyframes breathe{50%{opacity:.32}}
.node.lit .halo,.node:hover .halo{opacity:1;animation:none}
.node.beat .halo{animation:beat 1.4s ease-in-out infinite}
@keyframes beat{50%{opacity:.45}}
.track{fill:none;stroke:rgba(244,236,230,.13);stroke-width:2.2}
.arc{fill:none;stroke-width:2.6;stroke-linecap:round}
.lbl{font-size:13px;font-weight:650;fill:var(--ink);font-family:var(--mono);paint-order:stroke;stroke:#07060b;stroke-width:4.5px;stroke-linejoin:round}
.badge{font-size:12px;font-weight:700;paint-order:stroke;stroke:#07060b;stroke-width:4px}
.fring{fill:none;stroke:var(--hot);stroke-width:2;opacity:0}
.node:focus-visible .fring{opacity:1}
.orbit{fill:none;stroke:var(--hot);stroke-width:1.6;stroke-dasharray:3 7;opacity:0;transform-box:fill-box;transform-origin:center}
.node.sel .orbit{opacity:.95;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{stroke-width:1.2}
.ptext{font-size:12.5px;font-weight:650;fill:var(--ink)}
.ctext{font-size:13px;font-weight:700;fill:#ffd9c4}
.csub{font-size:12px;fill:var(--muted);font-family:var(--mono)}
.trail{fill:none;stroke:url(#trailg);stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(255,138,76,.8))}
.trail.draw{transition:stroke-dashoffset .9s ease-out}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:280px;background:rgba(17,14,22,.95);border:1px solid var(--line2);border-radius:12px;padding:9px 12px;font-size:13px;box-shadow:0 14px 30px rgba(0,0,0,.5);opacity:0;transform:translate(-50%,calc(-100% - 4px));transition:opacity .15s}
.tip.on{opacity:1}
.tip b{font-family:var(--mono);color:var(--c)}
.tip p{margin:3px 0 0;color:var(--muted)}
.tip small{display:block;margin-top:4px;color:var(--faint);font-size:12px}
.cap{margin:12px 12px 0;padding:12px 14px;background:rgba(17,13,20,.94);border:1px solid rgba(255,138,76,.4);border-radius:16px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.55),0 0 40px rgba(232,113,74,.12)}
.cap[hidden]{display:none}
.cap-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cap-step{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--hot);font-weight:700}
.cap-title{font-size:16px}
.cap p{margin:4px 0 10px;color:#e6dcd4;font-size:14px}
.cap-row{display:flex;align-items:center;gap:10px}
.segs{flex:1;display:flex;gap:4px}
.segs span{flex:1;height:4px;border-radius:2px;background:rgba(244,236,230,.14);overflow:hidden}
.segs span i{display:block;height:100%;background:linear-gradient(90deg,#e8714a,#ffb27e);transform-origin:left;transform:scaleX(0)}
.segs span.done i{transform:scaleX(1)}
.ib{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);display:inline-grid;place-items:center;cursor:pointer;padding:0}
.ib svg{fill:var(--ink)}
.ib:hover{border-color:var(--hot)}
.side{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;scrollbar-width:thin;border:1px solid var(--line);border-radius:22px;background:var(--panel)}
.card{padding:18px}
.card h2{margin:0 0 10px;font-size:15px;letter-spacing:.02em}
.card h3{margin:16px 0 8px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13.5px;color:#ddd3cb}
.lg li{display:flex;align-items:center;gap:10px}
.lg svg{flex:none}
.lv{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.lv li{display:grid;grid-template-columns:10px 1fr;gap:9px;align-items:baseline}
.lv i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.lv b{color:var(--c)}
.lv span{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.budget{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:1px;margin:10px 0 6px;background:rgba(244,236,230,.06)}
.budget span{background:var(--c);opacity:.85}
.budget span:hover{opacity:1}
.bcap{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}
pre.inst{margin:0;padding:10px 12px;border-radius:12px;background:#0d0b11;border:1px solid var(--line);font:12.5px/1.6 var(--mono);color:#ffd9c4;white-space:pre-wrap;word-break:break-all}
.inst-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.links{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;margin-top:14px}
#detail{display:none}
.has-sel #detail{display:block;animation:slidein .35s ease-out}
.has-sel #intro{display:none}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}}
.d-head{display:flex;gap:12px;align-items:center}
.d-orb{flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--c) 38%,color-mix(in srgb,var(--c) 40%,#000) 100%);box-shadow:0 0 22px var(--c)}
.d-orb.hex{border-radius:6px;transform:rotate(45deg) scale(.82)}
.d-orb.pill{border-radius:10px;height:22px}
.d-head h2{margin:0;font:700 20px/1.2 var(--mono);word-break:break-word}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid color-mix(in srgb,var(--c,#b9afa7) 60%,transparent);color:var(--c,#b9afa7)}
.x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.x:hover{border-color:var(--hot)}
.d-text{margin:14px 0 0;font-size:15px;color:#efe6df}
.say{margin:14px 0 0;padding:10px 12px;border-left:3px solid var(--c);background:rgba(244,236,230,.04);border-radius:0 10px 10px 0}
.k{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.say q{font-size:15px;font-style:italic;quotes:"“" "”"}
.say code{font:600 14px var(--mono);color:#ffd9c4}
.tok{margin-top:16px}
.tok .k small{text-transform:none;letter-spacing:0;color:var(--faint)}
.bar{height:8px;border-radius:4px;background:rgba(244,236,230,.08);overflow:hidden;margin:6px 0 3px}
.bar span{display:block;height:100%;border-radius:4px;background:var(--c);transform-origin:left;animation:grow .7s ease-out}
.bar.inv span{background:linear-gradient(90deg,#f4ece6,#ffd2b4)}
@keyframes grow{from{transform:scaleX(0)}}
.brow{font-size:13px;color:var(--muted)}
.brow b{color:var(--ink);font-variant-numeric:tabular-nums}
.rel{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{height:30px;font-family:var(--mono);font-size:13px}
.chips .chip em{font-family:var(--sans);font-style:normal;color:var(--muted);font-size:12px}
.muted{color:var(--muted);font-size:13.5px;margin:0}
.ctr{margin-top:14px;font-size:13px;color:#ffd9c4;display:flex;gap:8px;align-items:center}
.gh{display:inline-flex;margin-top:18px;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;border:1px solid rgba(255,138,76,.5);text-decoration:none;color:#ffd9c4;font-weight:600;font-size:14px}
.gh:hover{background:rgba(232,113,74,.14)}
.grab{display:none}
footer{position:relative;z-index:1;padding:26px 0 40px;color:var(--faint);font-size:12.5px;text-align:center}
@media (max-width:1060px){
 .stage{grid-template-columns:minmax(0,1fr)}
 .side{position:static;max-height:none;overflow:visible}
 #detail{display:block;position:fixed;z-index:30;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;border-radius:22px 22px 0 0;border:1px solid var(--line2);border-bottom:0;background:#121017;box-shadow:0 -20px 60px rgba(0,0,0,.65);transform:translateY(105%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1),visibility 0s .35s;animation:none!important}
 .has-sel #detail{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1)}
 .has-sel #intro{display:block}
 .grab{display:block;width:44px;height:5px;border-radius:3px;background:rgba(244,236,230,.25);margin:8px auto 0}
 .has-sel .wrap main{padding-bottom:40vh}
 .cap{position:fixed;z-index:25;left:8px;right:8px;bottom:8px;margin:0;max-width:720px;margin-inline:auto}
 .playing .wrap main{padding-bottom:190px}
}
@media (max-width:640px){
 .wrap{padding:0 14px}
 h1{font-size:26px}
 .stats{gap:8px;width:100%}
 .stats li{flex:1 1 40%;padding:7px 11px;min-width:0}
 .stats b{font-size:19px}
 .search{max-width:none;flex-basis:100%}
 .gwrap{border-radius:18px}
}
@media (prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
.still *,.still *:before,.still *:after{animation:none!important;transition:none!important}
</style>

 browser and records your pick in DESIGN.md.","ru":"Показывает три разных варианта внешнего вида рядом в браузере и записывает ваш выбор в DESIGN.md."},"say":{"en":"I need a new look for the settings screen","ru":"Нужен новый вид экрана настроек"},"desc":"Builds 3 different visual variants side by side in the browser and records the pick in DESIGN.md. Use when the user wants a new look, UI, screen design or game feel and the style isn't fixed. Not for styling within an existing design system."},{"id":"documenting","kind":"skill","group":"atomic","level":"atomic","mode":"auto","always":80,"invoke":790,"text":{"en":"Puts docs and decision records in their home.","ru":"Кладёт документацию и записи о решениях туда, где им место."},"say":{"en":"Record the decision to use Decimal","ru":"Запиши решение использовать Decimal"},"desc":"Writes project docs in the right place. Use when the user asks to document something, record a decision, write an ADR, or update the README or docs. Not for code comments, commit messages or reviews."},{"id":"executing","kind":"skill","group":"process","level":"process","mode":"auto","always":80,"invoke":1100,"text":{"en":"Runs the plan task by task with checks, one review per feature, then archives the plan.","ru":"Выполняет план задача за задачей с проверками, одно ревью на фичу, затем архивирует план."},"say":{"en":"Execute the plan","ru":"Выполняй план"},"desc":"Runs a written plan task by task with checks and a final review. Use when a plan exists and the user says go, implement it, execute the plan, or build the planned feature. Not for writing plans, single edits or reviews."},{"id":"groundwork","kind":"skill","group":"setup","level":"setup","mode":"auto","always":80,"invoke":1200,"text":{"en":"Sets up or audits a project for AI work: safety scan, a short CLAUDE.md contract, docs layout, helper agents. Writes after your ok.","ru":"Настраивает или проверяет проект для работы с ИИ: безопасность, короткий договор в CLAUDE.md, скелет docs/, eckable tasks and picks a model and effort per task. Small change: no plan needed.","ru":"Разбивает работу на упорядоченные проверяемые задачи и выбирает модель и усилие для каждой. Для мелкой правки план не нужен."},"say":{"en":"Make a plan for the refunds feature","ru":"Составь план для фичи возвратов"},"desc":"Breaks a feature into ordered, verifiable tasks in a plan file and assigns a model per task. Use when the user asks for a plan, a task breakdown, or which model fits a plan task, or a change spans several files. Not for small edits or reviews."},{"id":"refactoring","kind":"skill","group":"methods","level":"method","mode":"auto","always":90,"invoke":780,"text":{"en":"Changes structure, never behaviour, and only after tests are green.","ru":"Меняет структуру, но не поведение, и только при зелёных тестах."},"say":{"en":"Refactor report.py, remove the duplication","ru":"Отрефактори report.py, убери дублирование"},"desc":"Changes code structure without changing behaviour. Use when the user asks to refactor, clean up, restructure, extract, rename across files, reduce duplication, or improve the architecture. Not for features, bug fixes or reviews."},{"id":"reviewing","kind":"skill","group":"methods","level":"method","mode":"auto","always":90,"invoke":1000,"text":{"en":"Reviews against your standards and the spec and ends with a verdict: ship or fix first.","ru":"Проверяет изменение по стандартам проекта и спеке, итог: можно выпускать или сначала исправить."},"say":{"en":"Review my branch, is it ready to merge?","ru":"Проверь мою ветку, можно мёржить?"},"desc":"Reviews a diff against the project's standards and spec in priority order, ending in a ship or fix-first verdict. Use when the user asks to review code, a PR or a branch, \"is this ready to merge?\", or for UI code feedback. Not for debugging."},{"id":"shaping","kind":"skill","group":"process","level":"process","mode":"auto","always":90,"invoke":1400,"text":{"en":"Questions a raw idea until it becomes an approved spec in docs/specs/.","ru":"Задаёт вопросы по сырой идее, пока она не станет утверждённой спекой в docs/specs/."},"say":{"en":"I want to build a loyalty points system","ru":"Хочу сделать систему бонусных баллов"},"desc":"Turns a raw idea into an approved spec by questioning the user first. Use when the user has a new feature or product idea, says \"I want to build...\", or a request is vague with a design choice open. Not for clear small edits or bugs."},{"id":"skill-finder","kind":"skill","group":"setup","level":"setup","mode":"auto","always":90,"invoke":1100,"text":{"en":"Finds a third-party skill, vets every file through a read-only agent and installs only after your ok.","ru":"Находит чужой скилл, проверяет каждый его файл через агента только для чтения и ставит только после вашего «ок»."},"say":{"en":"Is there a skill for release notes?","ru":"Есть скилл для release notes?"},"desc":"Finds a third-party Claude skill, vets every file in it, and installs it only after your ok. Use when the user asks if there is a skill for X, wants to add a skill from GitHub or a registry, or asks whether a skill is safe."},{"id":"tdd","kind":"skill","group":"atomic","level":"atomic","mode":"auto","always":80,"invoke":680,"text":{"en":"Builds a change in red-green slices with expected values worked out independently of the code.","ru":"Строит изменение срезами «красный — зелёный», ожидаемые значения берёт независимо от реализации."},"say":{"en":"Add the discount rule test-first","ru":"Добавь правило скидки сначала с тестом"},"desc":"Builds a change test-first in red-green slices. Use when the user asks for tests first, TDD, a test-driven change, or a regression test for a bug fix. Not for plain \"add a function\", review or debugging."},{"id":"tidying","kind":"skill","group":"setup","level":"setup","mode":"auto","always":80,"invoke":1100,"text":{"en":"Finds junk by tier, shows a report and removes it reversibly (.trash/ or git rm) after your ok.","ru":"Ищет мусор по уровням, показывает отчёт и удаляет обратимо (.trash/ или git rm) после вашего «ок»."},"say":{"en":"The repo is messy, clean it up","ru":"В репозитории бардак, убери лишнее"},"desc":"Finds junk files (backups, temp, stray notes) and removes them reversibly after your ok. Use when the user asks to clean up the project, remove leftovers, or says the repo is messy. Not for refactoring code."},{"id":"tuning","kind":"skill","group":"meta","level":"meta","mode":"manual","always":80,"invoke":870,"text":{"en":"Reads the fire log and saved test runs, finds skills that never fire or keep failing, and proposes the smallest fix.","ru":"Читает журнал срабатываний и сохранённые прогоны тестов, находит скиллы, которые не срабатывают или падают, и предлагает минимальную правку."},"say":{"en":"/foma-skills:tuning","ru":"/foma-skills:tuning"},"desc":"Reads the pack's own evidence (fire log, saved test runs), finds skills that never fire or keep failing, and proposes the smallest fix, applied only after the user's ok. Run by hand: /foma-skills:tuning."},{"id":"writing-skills","kind":"skill","group":"meta","level":"meta","mode":"auto","always":90,"invoke":1000,"text":{"en":"Writes or tightens a skill: short description, tight steps, tested triggers.","ru":"Пишет или ужимает скилл: короткое описание, сжатые шаги, проверенные триггеры."},"say":{"en":"Write a skill for our release routine","ru":"Напиши скилл для нашего процесса релиза"},"desc":"Writes or tightens a Claude Code skill: short description, tight steps, tested triggers. Use when the user asks to create, write, improve or shrink a SKILL.md or a project skill, or says a skill never fires. Not for using a skill."},{"id":"implementer","kind":"agent","group":"agents","text":{"en":"Writes code, one task per call, in a fresh context. executing hands it the tasks of a larger plan.","ru":"Пишет код, одну задачу за вызов, в свежем контексте. executing отдаёт ему задачи большого плана."},"model":{"en":"Model from the plan (Opus complex, Sonnet }

function renderIntro(){
 var ui=D.ui[lang],h='<h2>'+esc(t('legend_h'))+'</h2><ul class="lg">';
 h+='<li><svg width="44" height="12"><path d="M2 6H38" stroke="#86b2f2" stroke-width="2"/><path d="M36 2l6 4-6 4z" fill="#86b2f2"/><circle cx="20" cy="6" r="3" fill="#fff"/></svg>'+esc(t('lg_call'))+'</li>';
 h+='<li><svg width="44" height="12"><path d="M2 6H38" stroke="#f2b44f" stroke-width="2" stroke-dasharray="5 5"/><path d="M36 2l6 4-6 4z" fill="#f2b44f"/></svg>'+esc(t('lg_signal'))+'</li>';
 h+='<li><svg width="44" height="26"><circle cx="22" cy="13" r="11" fill="none" stroke="rgba(244,236,230,.15)" stroke-width="2"/><circle cx="22" cy="13" r="11" fill="none" stroke="#5fceb4" stroke-width="2.4" stroke-dasharray="48 100" transform="rotate(-90 22 13)"/><circle cx="22" cy="13" r="6.5" fill="#5fceb4"/></svg>'+esc(t('lg_ring'))+'</li>';
 h+='<li><svg width="44" height="26"><polygon points="22,2 31.5,7.5 31.5,18.5 22,24 12.5,18.5 12.5,7.5" fill="#f08fb4" fill-opacity=".5" stroke="#f08fb4"/></svg>'+esc(t('lg_agent'))+'</li>';
 h+='<li><svg width="44" height="26"><circle cx="22" cy="13" r="11" fill="none" stroke="rgba(244,236,230,.45)" stroke-width="2" stroke-dasharray="3 4"/><circle cx="22" cy="13" r="6.5" fill="#f08fb4"/></svg>'+esc(t('lg_manual'))+'</li>';
 h+='<li><svg width="44" height="16"><rect x="2" y="3" width="40" height="10" rx="4" fill="rgba(232,113,74,.18)" stroke="#e8714a"/></svg>'+esc(t('contract_name'))+'</li></ul>';
 h+='<h3>'+esc(t('levels_h'))+'</h3><ul class="lv">';
 GROUPS.forEach(function(g){h+='<li style="--c:'+COL[g]+'"><i></i><div><b>'+esc(ui.groups[g])+'</b> <span>— '+esc(ui.group_desc[g])+'</span></div></li>'});
 h+='</ul><p class="note">'+esc(t('lv_rule'))+'</p>';
 var nf=lang==='ru'?'ru-RU':'en-US';
 h+='<h3>'+esc(t('budget_h'))+'</h3><p class="note" style="margin:0">'+esc(fmt(t('budget_txt'),{total:D.always_total.toLocaleString(nf),min:D.min_invoke.toLocaleString(nf),max:D.max_invoke.toLocaleString(nf)}))+'</p><div class="budget" role="img" aria-label="'+esc(t('budget_h'))+': ≈'+D.always_total+'">';
 var ordered=[].concat(D.order.setup,D.order.meta,D.order.process,D.order.methods,D.order.atomic);
 ordered.forEach(function(id){var n=N[id];h+='<span title="'+id+' · ~'+n.always+'" style="flex:'+n.always+';--c:'+COL[n.group]+'"></span>'});
 h+='</div><div class="bcap"><span>0</span><span>≈'+D.always_total.toLocaleString(nf)+' · '+esc(t('st_est'))+'</span></div>';
 h+='<h3>'+esc(t('install_h'))+'</h3><div class="inst-row"><span class="note" style="margin:0">Claude Code</span><button type="button" class="chip" id="copy">'+esc(t('copy'))+'</button></div><pre class="inst" id="inst">/plugin marketplace add t8jwscc7qy-sketch/foma-skills\n/plugin install foma-skills@foma</pre>';
 h+='<div class="links"><a href="'+D.repo+'">'+esc(t('repo'))+' ↗</a><a href="'+D.repo+'/blob/main/'+(lang==='ru'?'README.ru.md':'README.md')+'">'+esc(t('readme'))+' ↗</a></div>';
 $('#intro').innerHTML=h;
 $('#copy').addEventListener('click',function(){var b=this,txt=$('#inst').textContent;function ok(){b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy')},1600)}
  try{navigator.clipboard.writeText(txt).then(ok,function(){})}catch(e){}});
}
function syncControls(){
 document.querySelectorAll('#filters .chip').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-f')===filter))});
 document.querySelectorAll('#size button').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===sizeMode))});
 document.querySelectorAll('#lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===lang))});
}
$('#filters').addEventListener('click',function(ev){var b=ev.target.closest('[data-f]');if(!b)return;var f=b.getAttribute('data-f');filter=(f===filter&&f!=='all')?'all':f;if(play.on)stopPlay(true);syncControls();refresh();writeHash()});
$('#size').addEventListener('click',function(ev){var b=ev.target.closest('[data-v]');if(!b)return;sizeMode=b.getAttribute('data-v');firstRender=true;syncControls();render();writeHash()});
$('#lang').addEventListener('click',function(ev){var b=ev.target.closest('[data-v]');if(b)setLang(b.getAttribute('data-v'),true)});
$('#playbtn').addEventListener('click',function(){startPlay(0,true);var b=$('#cap [data-a="pp"]');if(b)b.focus({preventScroll:true})});
var lastHash='';
function writeHash(){
 var p=[];if(sel)p.push('skill='+encodeURIComponent(sel));if(langPinned)p.push('lang='+lang);if(filter!=='all')p.push('filter='+filter);
 if(sizeMode!=='tokens')p.push('size='+sizeMode);if(play.on)p.push('play='+(play.step+1));
 var h=p.length?'#'+p.join('&'):'';lastHash=h;
 try{history.replaceState(null,'',h||location.pathname+location.search)}catch(e){}
}
function readHash(){
 var p={};location.hash.replace(/^#/,'').split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});return p;
}
function applyHash(init){
 var p=readHash();
 if(p.lang==='en'||p.lang==='ru'){lang=p.lang;langPinned=true}
 filter=GROUPS.indexOf(p.filter)>=0?p.filter:'all';
 sizeMode=p.size==='equal'?'equal':'tokens';
 applyText();render();
 if(p.play){var s=parseInt(p.play,10);if(s>=1&&s<=D.play.length){startPlay(s-1,false);return}}
 if(play.on)stopPlay(true);
 if(p.skill&&N[p.skill]){select(p.skill);if(init)scrollToNode(p.skill)}else if(sel)closeSel(false);
}
window.addEventListener('hashchange',function(){if(location.hash!==lastHash)applyHash(false)});
document.addEventListener('keydown',function(ev){
 if(ev.key==='/'&&document.activeElement!==q&&!ev.ctrlKey&&!ev.metaKey){ev.preventDefault();q.focus()}
 else if(ev.key==='Escape'){if(play.on){stopPlay();$('#playbtn').focus()}else if(sel)closeSel(true);hideTip()}
});
var lastW=0,rt=0;
function onResize(){clearTimeout(rt);rt=setTimeout(function(){if(Math.round(gwrap.clientWidth)!==lastW){lastW=Math.round(gwrap.clientWidth);hideTip();render()}},120)}
window.addEventListener('resize',onResize);

/* ---------- main loop ---------- */
var prev=0;
function frame(ts){
 var dt=Math.min(.05,(ts-(prev||ts))/1000);prev=ts;
 if(!document.hidden){
  for(var i=0;i<parts.length;i++){var q2=parts[i];q2.t=(q2.t+dt/q2.dur)%1;var f=q2.t*48,k=f|0,u=f-k,a=q2.pts;
   var x=a[k*2]+(a[k*2+2]-a[k*2])*u,y=a[k*2+1]+(a[k*2+3]-a[k*2+1])*u;
   q2.c.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+')');q2.c.setAttribute('opacity',Math.min(1,Math.sin(q2.t*Math.PI)*2.2).toFixed(2))}
  if(intro.length){if(!introT0)introT0=ts;var done=true;for(var j=0;j<intro.length;j++){var o=intro[j],pr0=((ts-introT0)/1000-o.d)/.7;if(pr0<1)done=false;pr0=Math.max(0,Math.min(1,pr0));
    var bk=1+2.2*Math.pow(pr0-1,3)+1.2*Math.pow(pr0-1,2);o.el.style.opacity=Math.min(1,pr0*2.5).toFixed(2);o.el.style.transform=pr0>=1?'':'scale('+(.3+.7*bk).toFixed(3)+')'}if(done){intro.forEach(function(o){o.el.style.opacity='';o.el.style.transform=''});intro=[]}}
  if(comet){if(!comet.t0)comet.t0=ts;var pr=Math.min(1,(ts-comet.t0)/900),e2=1-Math.pow(1-pr,3),L2=comet.path.getTotalLength(),pt=comet.path.getPointAtLength(L2*e2);
   comet.el.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+')');if(pr>=1)comet=null}
 }
 if(!RM)requestAnimationFrame(frame);
}
/* ---------- boot ---------- */
var saved=store.get('foma-graph-lang');
lang=saved==='ru'||saved==='en'?saved:((navigator.language||'en').toLowerCase().indexOf('ru')===0?'ru':'en');
if(saved)langPinned=true;
lastW=Math.round(gwrap.clientWidth);
applyHash(true);booted=true;
if(!RM)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
