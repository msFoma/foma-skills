<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design variants</title>
<script>
/* foma-skills design-interview: fill this block, leave the rest as is. */
const CONFIG = {
  feature: "FEATURE",
  mode: "web", // web | mobile | game
  variants: [
    // { id: "A", file: "a.html", lens: "safe", note: "one line" },
  ],
  parts: ["Layout", "Type", "Colour", "Spacing", "Motion"], // game: ["Feel", "Juice", "Look"]
};
</script>
<style>
:root { --bg:#f4f3ef; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#dcdad3; --sel:#1d1d1b; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1f1f1d; --ink:#ecebe6; --muted:#9b9a94; --line:#33332f; --sel:#ecebe6; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; }
header h1 { font-size:15px; margin:0 12px 0 0; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { border:0; background:none; color:var(--ink); padding:6px 10px; font:inherit; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--sel); color:var(--bg); }
.hint { color:var(--muted); margin-left:auto; }
main { display:grid; gap:16px; padding:16px; }
main.side { grid-template-columns:repeat(var(--n), minmax(0,1fr)); }
.card { background:var(--panel); border:2px solid var(--line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; }
.card.picked { border-color:var(--sel); }
.card .top { display:flex; gap:8px; align-items:baseline; padding:8px 12px; border-bottom:1px solid var(--line); }
.card .id { font-weight:600; font-size:16px; }
.card .lens { color:var(--muted); }
.card .note { padding:6px 12px; color:var(--muted); border-bottom:1px solid var(--line); min-height:2.8em; }
.frame { position:relative; overflow:hidden; height:var(--h); }
.frame iframe { border:0; transform-origin:0 0; position:absolute; left:0; top:0; background:#fff; }
main.one .card:not(.current) { display:none; }
aside { background:var(--panel); border-top:1px solid var(--line); padding:16px; display:grid; gap:12px; }
aside table { border-collapse:collapse; }
aside td, aside th { padding:4px 10px 4px 0; text-align:left; font-weight:normal; }
aside th { color:var(--muted); }
textarea { width:100%; min-height:60px; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; }
.actions { display:flex; gap:12px; align-items:center; }
.primary { background:var(--sel); color:var(--bg); border:0; border-radius:6px; padding:8px 14px; font:inherit; cursor:pointer; }
#out { white-space:pre-wrap; font:12px/1.4 ui-monospace, monospace; color:var(--muted); }
@media (max-width: 800px) { main.side { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="seg" id="view"><button data-v="side" aria-pressed="true">Side by side</button><button data-v="one">One at a time</button></span>
  <span class="seg" id="width"><button data-w="375">375</button><button data-w="768">768</button><button data-w="1440" aria-pressed="true">1440</button></span>
  <span class="hint">Keys 1–4: show one · ←/→: next</span>
</header>
<main id="grid" class="side"></main>
<aside>
  <table id="mix"></table>
  <textarea id="notes" placeholder="Why this one? What to change?"></textarea>
  <div class="actions"><button class="primary" id="copy">Copy choice</button><span id="status"></span></div>
  <div id="out"></div>
</aside>
<script>
(() => {
  const V = CONFIG.variants, grid = document.getElementById("grid"), states = {};
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const key = "foma-design:" + CONFIG.feature;
  const saved = store.get(key) || {};
  let width = saved.width || 1440, current = 0;
  document.getElementById("title").textContent = CONFIG.feature + " · " + CONFIG.mode;
  grid.style.setProperty("--n", V.length || 1);
  if (!V.length) grid.textContent = "No variants configured: fill CONFIG.variants.";

  V.forEach((v, i) => {
    const c = document.createElement("section");
    c.className = "card"; c.dataset.id = v.id;
    c.innerHTML = '<div class="top"><span class="id"></span><span class="lens"></span></div><div class="note"></div><div class="frame"><iframe loading="lazy"></iframe></div>';
    c.querySelector(".id").textContent = v.id;
    c.querySelector(".lens").textContent = v.lens || "";
    c.querySelector(".note").textContent = v.note || "";
    const f = c.querySelector("iframe");
    f.title = "Variant " + v.id; f.src = v.file;
    f.addEventListener("load", () => { try { f.contentWindow.postMessage("foma:get", "*"); } catch {} });
    grid.appendChild(c);
  });

  addEventListener("message", e => {
    if (!e.data || e.data.type !== "foma:state") return;
    const i = [...grid.querySelectorAll("iframe")].findIndex(f => f.contentWindow === e.source);
    if (i >= 0) states[V[i].id] = e.data.state;
  });

  function layout() {
    grid.querySelectorAll(".frame").forEach(fr => {
      const f = fr.querySelector("iframe"), w = fr.clientWidth || 1, s = Math.min(1, w / width);
      const h = Math.round((width < 800 ? 812 : 900) * s);
      f.style.width = width + "px"; f.style.height = (h / s) + "px"; f.style.transform = "scale(" + s + ")";
      fr.style.setProperty("--h", h + "px");
    });
  }
  new ResizeObserver(layout).observe(grid);

  function press(group, attr, val) {
    document.querySelectorAll("#" + group + " button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === String(val))));
  }
  function setView(v) {
    grid.className = v; press("view", "v", v);
    grid.querySelectorAll(".card").forEach((c, i) => c.classList.toggle("current", i === current));
    layout();
  }
  document.getElementById("view").onclick = e => { if (e.target.dataset.v) setView(e.target.dataset.v); };
  document.getElementById("width").onclick = e => {
    if (!e.target.dataset.w) return;
    width = +e.target.dataset.w; press("width", "w", width); layout(); save();
  };
  press("width", "w", width);
  addEventListener("keydown", e => {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || !V.length) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= V.length) { current = n - 1; setView("one"); }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      current = (current + (e.key === "ArrowRight" ? 1 : V.length - 1)) % V.length; setView("one");
    }
  });

  const mix = document.getElementById("mix"), opts = ['<option value="">—</option>'].concat(V.map(v => '<option>' + v.id + '</option>')).join("");
  mix.innerHTML = '<tr><th>Pick</th><td><select data-part="pick">' + opts + '</select></td></tr>' +
    CONFIG.parts.map(p => '<tr><th>' + p + ' from</th><td><select data-part="' + p + '">' + opts + '</select></td></tr>').join("");
  const notes = document.getElementById("notes");
  mix.querySelectorAll("select").forEach(s => { s.value = (saved.sel || {})[s.dataset.part] || ""; s.onchange = () => { mark(); save(); }; });
  notes.value = saved.notes || ""; notes.oninput = save;
  function sel() { const o = {}; mix.querySelectorAll("select").forEach(s => o[s.dataset.part] = s.value); return o; }
  function mark() { const p = sel().pick; grid.querySelectorAll(".card").forEach(c => c.classList.toggle("picked", c.dataset.id === p)); }
  function save() { store.set(key, { width, sel: sel(), notes: notes.value }); }
  mark();

  document.getElementById("copy").onclick = async () => {
    grid.querySelectorAll("iframe").forEach(f => { try { f.contentWindow.postMessage("foma:get", "*"); } catch {} });
    await new Promise(r => setTimeout(r, 150));
    const s = sel(), used = new Set([s.pick, ...CONFIG.parts.map(p => s[p])].filter(Boolean));
    const lines = ["design-interview choice: " + CONFIG.feature, "pick: " + (s.pick || "none")];
    const m = CONFIG.parts.filter(p => s[p]).map(p => p.toLowerCase() + "=" + s[p]);
    lines.push("mix: " + (m.length ? m.join(", ") : "none"));
    if (notes.value.trim()) lines.push("notes: " + notes.value.trim());
    used.forEach(id => { if (states[id]) lines.push("state " + id + ": " + JSON.stringify(states[id])); });
    const text = lines.join("\n");
    document.getElementById("out").textContent = text;
    const st = document.getElementById("status");
    try { await navigator.clipboard.writeText(text); st.textContent = "Copied. Paste it into the chat."; }
    catch { st.textContent = "Copy failed: select the text below and copy it."; }
  };
  setView("side");
})();
</script>
</body>
</html>
