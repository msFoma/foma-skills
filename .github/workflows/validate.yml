name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Pinned CLI version; bump deliberately after checking the validator output.
      - run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate plugin
        run: claude plugin validate plugins/foma-skills --strict
      - name: Skill checks (lite standard §9)
        run: |
          python3 -m unittest scripts/test_check_skills.py scripts/test_harness.py
          python3 scripts/check_skills.py
      - name: Plugin LICENSE matches root
        run: cmp LICENSE plugins/foma-skills/LICENSE
