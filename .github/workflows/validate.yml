name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pinned CLI version; bump deliberately after checking the validator output.
      - run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Validate marketplace
        run: claude plugin validate . --strict
      - name: Validate plugin
        run: claude plugin validate plugins/foma-skills --strict
